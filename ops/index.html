const fmt = (n) => { if(Math.abs(n)>=1e6) return `$${(n/1e6).toFixed(1)}M`; if(Math.abs(n)>=1000) return `$${(n/1000).toFixed(0)}K`; return `$${n.toFixed(0)}`; };
const fmtF = (n) => { if(n===0) return "-"; const s=`$${Math.abs(n).toLocaleString("en-US",{maximumFractionDigits:0})}`; return n<0?`(${s})`:s; };
const pct = (n) => `${(n*100).toFixed(1)}%`;
function timeAgo(iso) { if(!iso) return "never"; const sec=Math.floor((Date.now()-new Date(iso).getTime())/1000); if(sec<60) return "just now"; if(sec<3600) return `${Math.floor(sec/60)} min ago`; if(sec<86400) return `${Math.floor(sec/3600)} hr ago`; const days=Math.floor(sec/86400); return days<30?`${days}d ago`:`${Math.floor(days/30)}mo ago`; }
function ageDays(iso) { if(!iso) return null; return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function parseNum(s) { if(!s||typeof s!=="string") return 0; s=s.trim().replace(/[\$,\s]/g,""); if(s==="-"||s===""||s==="n/a"||s.includes("DIV")) return 0; const neg=s.startsWith("(")&&s.endsWith(")"); if(neg) s=s.slice(1,-1); const n=parseFloat(s); return isNaN(n)?0:neg?-n:n; }

/* ═══════════════════════════════════════════════════════════

function parseCSV(text) {
  const rows = []; let cur="", inQ=false;
  for(const ch of text) { if(ch==='"'){inQ=!inQ;cur+=ch;} else if(ch==='\n'&&!inQ){rows.push(cur);cur="";} else cur+=ch; }
  if(cur.trim()) rows.push(cur);
  return rows.map(r => { const f=[]; let field="",q=false; for(const ch of r.replace(/\r/g,"")){ if(ch==='"') q=!q; else if(ch===","&&!q){f.push(field.trim());field="";} else field+=ch; } f.push(field.trim()); return f; });
}

function extractWeekly(csvText) {
  const rows=parseCSV(csvText); if(rows.length<10) return null;
  let dates=[],updatedThru=""; const dp=/\d{1,2}-[A-Za-z]{3}/;
  for(let i=0;i<12;i++){const r=rows[i]; if(r&&r.filter(c=>dp.test(c)).length>=3){for(let c=3;c<21;c+=3) if(dp.test(r[c])) dates.push(r[c].trim()); break;}}
  for(let i=0;i<5;i++) if(rows[i]?.[0]&&/updated/i.test(rows[i][0])) updatedThru=rows[i][0].replace(/Updated thru\s*/i,"").trim();
  const locNames=["Big Lake","Gonzales","Gonzalez","Live Oak"]; const locations=[];
  for(let i=0;i<rows.length;i++){
    const r=rows[i]; if(!r?.[0]) continue;
    const lm=locNames.find(n=>r[0].trim().toLowerCase().includes(n.toLowerCase())); if(!lm) continue;
    const ln=lm==="Gonzales"?"Gonzalez":lm; const loc={name:ln};
    const fields=["water","solids","solidsRev","washouts","oilSold","totalRevenue","laborCost","overhead","pl"];
    fields.forEach(f=>{loc[f]={daily:[],weekTotal:0,mtd:0};});
    for(let d=0;d<6;d++){const b=3+d*3; loc.water.daily.push({day:parseNum(r[b]),night:parseNum(r[b+1]),total:parseNum(r[b+2])});}
    loc.water.weekTotal=parseNum(r[24]);
    const findMtd=(row)=>{const v21=parseNum(String(row[21]||"")); if(v21!==0) return v21; const v27=parseNum(String(row[27]||"")); if(v27!==0) return v27; return 0;};
    loc.water.mtd=findMtd(r);
    for(let j=i+1;j<Math.min(i+15,rows.length);j++){
      const sr=rows[j]; if(!sr?.[1]) continue; const lb=sr[1].trim().toLowerCase(); let t=null;
      if(lb.includes("solids")&&lb.includes("revenue")) t=loc.solidsRev; else if(lb.includes("solid")) t=loc.solids;
      else if(lb.includes("washout")) t=loc.washouts; else if(lb.includes("oil sold")) t=loc.oilSold;
      else if(lb.includes("total revenue")) t=loc.totalRevenue; else if(lb.includes("labor")) t=loc.laborCost;
      else if(lb.includes("facility")||lb.includes("overhead")) t=loc.overhead; else if(lb==="p/l") t=loc.pl;
      if(t){t.daily=[]; for(let d=0;d<6;d++){const b=3+d*3; t.daily.push({day:parseNum(sr[b]),night:parseNum(sr[b+1]),total:parseNum(sr[b+2])});} t.weekTotal=parseNum(sr[24]); t.mtd=findMtd(sr);}
      if(sr[0]?.trim()&&locNames.some(n=>sr[0].trim().toLowerCase().includes(n.toLowerCase()))) break;
      if(lb==="p/l") break;
    }
    locations.push(loc);
  }
  return {dates,updatedThru,locations,uploadedAt:new Date().toISOString()};
}

function parseXLSX(buffer) {
  try {
    const wb=XLSX.read(new Uint8Array(buffer),{type:"array"});
    const conName=wb.SheetNames.find(n=>/consol/i.test(n))||wb.SheetNames.find(n=>/summary|p\s*&?\s*l|profit|income/i.test(n))||wb.SheetNames[0];
    const raw=XLSX.utils.sheet_to_json(wb.Sheets[conName],{header:1,defval:0}); if(raw.length<5) return null;
    let monthRow=-1;
    const monthRegex=/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\.?\s*[\-\/]?\s*2\d(\s*,?\s*20\d{2})?$/i;
    const monthRegex2=/^(January|February|March|April|May|June|July|August|September|October|November|December)\s+20?\d{2,4}$/i;
    const isMonthCell=(v)=>{const s=String(v||"").trim(); return monthRegex.test(s)||monthRegex2.test(s);};
    for(let r=0;r<Math.min(30,raw.length);r++){if((raw[r]||[]).filter(isMonthCell).length>=3){monthRow=r;break;}}
    if(monthRow<0) return null;
    const monthCols=[]; for(let c=0;c<(raw[monthRow]||[]).length;c++){if(isMonthCell(raw[monthRow][c])) monthCols.push({col:c,label:String(raw[monthRow][c]).trim()});}
    const last12=monthCols.slice(-12); const months=last12.map(m=>m.label); const shortMo=months.map(m=>m.split(" ")[0].replace(/\.,?$/,""));
    const cols=last12.map(m=>m.col);
    const findRowMulti=(searches,from=0)=>{const list=Array.isArray(searches)?searches:[searches]; for(const search of list){const s=search.toLowerCase(); for(let r=from;r<raw.length;r++) for(let c=0;c<Math.min(12,(raw[r]||[]).length);c++) if(String(raw[r][c]||"").trim().toLowerCase().includes(s)) return r;} return -1;};
    const getVals=(rowIdx)=>rowIdx<0||!raw[rowIdx]?cols.map(()=>0):cols.map(c=>{const v=raw[rowIdx]?.[c]; if(typeof v==="number") return v; const cleaned=String(v||"0").replace(/[\$,\s]/g,""); const neg=cleaned.startsWith("(")&&cleaned.endsWith(")"); const n=parseFloat(neg?cleaned.slice(1,-1):cleaned); return isNaN(n)?0:neg?-n:n;});
    const gpRow=findRowMulti(["gross profit","total gross profit"]);
    const niRow=findRowMulti(["net income","net ordinary income","net profit"],Math.max(0,gpRow));
    const revRow=findRowMulti(["total income","total revenue","net revenue","income","revenue"]);
    const result={months,shortMo,
      revenue:getVals(revRow), grossProfit:getVals(gpRow),
      ebitda:getVals(findRowMulti(["ebitda","earnings before"])),
      adjEbitda:getVals(findRowMulti(["adjusted ebitda","adj ebitda","adj. ebitda"])),
      ttmEbitda:getVals(findRowMulti(["ttm ebitda","ttm adjusted ebitda","trailing 12"])),
      fixedCosts:getVals(findRowMulti(["total total fixed cost","total fixed cost","fixed costs","total fixed expenses"])),
      variableCosts:getVals(findRowMulti(["total total variable cost","total variable cost","variable costs","total variable expenses"])),
      labor:getVals(findRowMulti(["641202","total labor","total payroll","payroll expense","total wages"])),
      netIncome:getVals(niRow),
      interest:getVals(findRowMulti(["total 6605","interest expense","total interest"])),
      liquid:getVals(findRowMulti(["total 6001","liquid revenue","liquids"])),
      solids:getVals(findRowMulti(["total 6002","solids revenue","solids"])),
      skimOil:getVals(findRowMulti(["total 6003","skim oil","oil revenue"])),
      washout:getVals(findRowMulti(["total 6004","washout revenue","washouts"])),
      source:`Uploaded P&L (${months[months.length-1]})`, uploadedAt:new Date().toISOString(),
    };
    for(const [key,search] of [["bigLake","Big Lake"],["gonzalez","Gonzal"],["liveOak","Live Oak"]]){
      const sn=wb.SheetNames.find(n=>new RegExp(search,"i").test(n)); if(!sn) continue;
      const lraw=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:0}); let lMonthRow=-1;
      for(let r=0;r<Math.min(30,lraw.length);r++){if((lraw[r]||[]).filter(isMonthCell).length>=3){lMonthRow=r;break;}} if(lMonthRow<0) continue;
      const lCols=[]; for(let c=0;c<(lraw[lMonthRow]||[]).length;c++) if(isMonthCell(lraw[lMonthRow][c])) lCols.push(c);
      const ll12=lCols.slice(-12);
      const lFind=(alts,from=0)=>{for(const s of alts){for(let r=from;r<lraw.length;r++) for(let c=0;c<12;c++) if(String(lraw[r]?.[c]||"").toLowerCase().includes(s.toLowerCase())) return r;} return -1;};
      const lVals=(ri)=>ri<0?ll12.map(()=>0):ll12.map(c=>{const v=lraw[ri]?.[c]; if(typeof v==="number") return v; const cl=String(v||"0").replace(/[\$,\s]/g,""); const ng=cl.startsWith("(")&&cl.endsWith(")"); const n=parseFloat(ng?cl.slice(1,-1):cl); return isNaN(n)?0:ng?-n:n;});
      const revR=lFind(["total income","total revenue","net revenue","income"]);
      const niR=lFind(["net income","net ordinary income"],Math.max(0,lFind(["gross profit"])));
      result[key]={rev:lVals(revR),ni:lVals(niR)};
    }
    return result;
  } catch(e){console.error("XLSX parse error:",e); return null;}
}

/* ═══════════════════════════════════════════════════════════
   FIX #2: MONTH-LEVEL MERGE FUNCTION
   Instead of replacing all data on upload, this merges by month
   ═══════════════════════════════════════════════════════════ */
function normalizeMonthLabel(label) {
  const s = String(label).trim();
  const map = {January:"Jan",February:"Feb",March:"Mar",April:"Apr",May:"May",June:"Jun",July:"Jul",August:"Aug",September:"Sep",October:"Oct",November:"Nov",December:"Dec"};
  for (const [full, short] of Object.entries(map)) { if (s.startsWith(full)) return s.replace(full, short); }
  return s.replace(/\./g,"").replace(/\s+/g," ");
}

function monthSortKey(label) {
  const n = normalizeMonthLabel(label);
  const parts = n.split(/\s+/);
  const mo = parts[0]; const yr = parseInt(parts[1]||"0");
  const fullYear = yr < 100 ? 2000 + yr : yr;
  const moIdx = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].indexOf(mo);
  return fullYear * 100 + (moIdx >= 0 ? moIdx : 0);
}

function mergeMonthlyData(existing, incoming) {
  const eMap = {}; existing.months.forEach((m,idx) => eMap[normalizeMonthLabel(m)] = idx);
  const iMap = {}; incoming.months.forEach((m,idx) => iMap[normalizeMonthLabel(m)] = idx);
  const allLabels = [...new Set([...existing.months.map(normalizeMonthLabel), ...incoming.months.map(normalizeMonthLabel)])];
  allLabels.sort((a,b) => monthSortKey(a) - monthSortKey(b));
  const final12 = allLabels.slice(-12);
  const arrayKeys = ['revenue','grossProfit','ebitda','adjEbitda','ttmEbitda','fixedCosts','variableCosts','labor','netIncome','interest','liquid','solids','skimOil','washout'];
  const result = { months: final12, shortMo: final12.map(m => m.split(" ")[0]), source: incoming.source, uploadedAt: incoming.uploadedAt };
  for (const key of arrayKeys) {
    result[key] = final12.map(month => {
      const iIdx = iMap[month]; const eIdx = eMap[month];
      if (iIdx !== undefined) { const v = incoming[key]?.[iIdx] || 0; if (v !== 0) return v; }
      if (eIdx !== undefined) return existing[key]?.[eIdx] || 0;
      if (iIdx !== undefined) return incoming[key]?.[iIdx] || 0;
      return 0;
    });
  }
  for (const locKey of ['bigLake','gonzalez','liveOak']) {
    const eL = existing[locKey] || {rev:[],ni:[]}; const iL = incoming[locKey] || {rev:[],ni:[]};
    result[locKey] = {
      rev: final12.map(month => { const ii=iMap[month],ei=eMap[month]; if(ii!==undefined&&(iL.rev?.[ii]||0)!==0) return iL.rev[ii]; if(ei!==undefined) return eL.rev?.[ei]||0; return iL.rev?.[ii]||0; }),
      ni: final12.map(month => { const ii=iMap[month],ei=eMap[month]; if(ii!==undefined&&(iL.ni?.[ii]||0)!==0) return iL.ni[ii]; if(ei!==undefined) return eL.ni?.[ei]||0; return iL.ni?.[ii]||0; }),
    };
  }
  return result;
}

/* ═══════════════════════════════════════════════════════════
   RED FLAGS ENGINE
   ═══════════════════════════════════════════════════════════ */
function generateRedFlags(D, W, i) {
  const flags = [];
  if (D.ttmEbitda.length >= 2) { const cur=D.ttmEbitda[i]||0,peak=Math.max(...D.ttmEbitda); if(peak>0&&cur<peak*0.85){const dropPct=((peak-cur)/peak*100).toFixed(0),valueLost=(peak-cur)*5; flags.push({severity:"critical",text:`TTM EBITDA down ${dropPct}% from peak (${fmt(peak)} to ${fmt(cur)}). At 5x, that's ${fmt(valueLost)} in enterprise value lost.`});} }
  if (i>0&&D.revenue[i]>0&&D.revenue[i-1]>0) { const momDelta=(D.revenue[i]-D.revenue[i-1])/D.revenue[i-1]; if(momDelta<-0.2) flags.push({severity:"high",text:`Revenue down ${Math.abs(momDelta*100).toFixed(0)}% MoM (${fmt(D.revenue[i-1])} to ${fmt(D.revenue[i])}).`}); }
  const niSlice=D.netIncome.slice(Math.max(0,i-2),i+1); const negCount=niSlice.filter(v=>v<0).length;
  if(negCount>=2) flags.push({severity:"high",text:`${negCount} of last ${niSlice.length} months net income negative. Cumulative: ${fmtF(niSlice.reduce((a,b)=>a+b,0))}.`});
  if(W){W.locations.forEach(l=>{const pl=l.pl?.weekTotal||0,rev=l.totalRevenue?.weekTotal||0; if(pl<0&&rev>0) flags.push({severity:"high",text:`${l.name}: Lost ${fmtF(Math.abs(pl))} this week on ${fmtF(rev)} revenue. Negative margin operation.`}); if(rev===0&&pl===0) flags.push({severity:"watch",text:`${l.name}: Zero revenue and zero P&L this week. Location inactive?`});});}
  const curLabPct=D.revenue[i]>0?(D.labor[i]||0)/D.revenue[i]:0; if(curLabPct>0.16) flags.push({severity:"watch",text:`Labor at ${(curLabPct*100).toFixed(1)}% of revenue (target: <14%). Overstaffed or underutilized.`});
  const curFCov=D.revenue[i]>0?D.revenue[i]/(D.fixedCosts[i]||1):0; if(curFCov>0&&curFCov<1.5) flags.push({severity:"high",text:`Fixed cost coverage at ${curFCov.toFixed(1)}x (need 2.0x). Revenue barely covering overhead.`});
  const mAge=ageDays(D.uploadedAt); if(mAge===null) flags.push({severity:"watch",text:"Running on sample data. Upload your actual P&L to see real numbers."}); else if(mAge>45) flags.push({severity:"watch",text:`P&L data is ${mAge} days old. Numbers may not reflect current reality.`});
  const jan26=D.months.findIndex(m=>/Jan\s*26/i.test(m)); const closedM=jan26>=0?D.revenue.slice(jan26).filter(v=>v!==0).length:0;
  if(closedM>=2){const ytdTotal=jan26>=0?D.revenue.slice(jan26).reduce((a,b)=>a+b,0):0; const annPace=(ytdTotal/closedM)*12; if(annPace<BENCH.total.target*0.75) flags.push({severity:"critical",text:`At current pace (${fmt(annPace)}/yr), company will miss even Tier 1 (75%) of the ${fmtF(BENCH.total.target)} target. Need ${fmt(BENCH.total.target/12)}/mo.`}); else if(annPace<BENCH.total.target) flags.push({severity:"high",text:`Annualized pace ${fmt(annPace)} is below the ${fmtF(BENCH.total.target)} target. Need to average ${fmt(BENCH.total.target/12)}/mo to hit 100%.`});}
  return flags.sort((a,b)=>{const order={critical:0,high:1,watch:2}; return (order[a.severity]||3)-(order[b.severity]||3);});
}

function Spark({data,color=tj.navy900,height:h=32,width:w=120}) {
  if(!data||data.length<2) return null;
  const mn=Math.min(...data),mx=Math.max(...data),rng=mx-mn||1;
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-mn)/rng)*(h-4)-2}`).join(" ");
  const lastY=h-((data[data.length-1]-mn)/rng)*(h-4)-2;
  return (<svg width={w} height={h} style={{display:"block"}}><polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/><circle cx={w} cy={lastY} r="2.5" fill={color}/></svg>);
}

26A69A":"#EF5350",bodyTop2=yScale(Math.max(c.open,c.close)),bodyBot2=yScale(Math.min(c.open,c.close)),bodyH2=Math.max(bodyBot2-bodyTop2,3),wickTop2=yScale(c.high),wickBot2=yScale(c.low); return <g key={idx} onMouseEnter={()=>setPTip({px:x,py:wickTop2,...c})} onMouseLeave={()=>setPTip(null)} style={{cursor:"crosshair"}}><line x1={x} y1={wickTop2} x2={x} y2={bodyTop2} stroke={bodyColor} strokeWidth="1.5"/><line x1={x} y1={bodyBot2} x2={x} y2={wickBot2} stroke={bodyColor} strokeWidth="1.5"/><rect x={x-candleW2/2} y={bodyTop2} width={candleW2} height={bodyH2} fill={bodyColor} stroke={bodyColor} strokeWidth="1" rx="1"/><text x={x} y={h-10} textAnchor="middle" fontSize="9" fill={tj.gray700} fontFamily={tj.fontSans}>{c.label}</text></g>;})}</svg></div>);
}

function BriefingCard({D,W,i,monthlyTarget,remainingDays,monthName,today,locationsMeta,lastPopDay,currentMTD,locCurrentMTD}) {
  const [genMsg,setGenMsg]=useState(""); const [copied,setCopied]=useState(false);
  const dailyBreakevenGen=((D.fixedCosts[i]||330000)/30)*1.1;
  const companyMonthGapGen=Math.max(0,monthlyTarget-currentMTD); const companyDailyNeedGen=companyMonthGapGen/remainingDays;
  function buildMsg(){
    const d=today.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}); const noMTD=currentMTD===0; const lines=[];
    lines.push(`TEJAS DAILY TARGETS - ${d}`); if(noMTD) lines.push(`MTD data not loaded - upload weekly CSV for accurate numbers`); lines.push("");
    lines.push(`COMPANY`); lines.push(` Monthly target: ${fmtF(monthlyTarget)}`); if(!noMTD) lines.push(` MTD revenue: ${fmtF(currentMTD)}`);
    lines.push(` Need today to hit goal: ${fmtF(companyDailyNeedGen)}`); lines.push(` Daily breakeven: ${fmtF(dailyBreakevenGen)}`); lines.push(` Days left in ${monthName}: ${remainingDays}`); lines.push("");
    locationsMeta.forEach(loc=>{const wLoc=W?.locations?.find(l=>l.name.toLowerCase().includes(loc.name.split(" ")[0].toLowerCase()));
      const locTarget=BENCH[loc.k].target/12; const locMTD=locCurrentMTD(loc); const locGap=Math.max(0,locTarget-locMTD);
      const locDailyNeedGen=locGap/remainingDays; const locBE=dailyBreakevenGen*BENCH[loc.k].weight;
      const locYesterday=lastPopDay>=0?(wLoc?.totalRevenue?.daily?.[lastPopDay]?.total||0):0;
      lines.push(`${loc.name.toUpperCase()}`); lines.push(` Monthly target: ${fmtF(locTarget)}`); if(!noMTD) lines.push(` MTD revenue: ${fmtF(locMTD)}`);
      lines.push(` Need today to hit goal: ${fmtF(locDailyNeedGen)}`); lines.push(` Breakeven today: ${fmtF(locBE)}`);
      if(locYesterday>0) lines.push(` Yesterday: ${fmtF(locYesterday)}`); lines.push("");
    }); return lines.join("\n");
  }
  function handleGenerate(){setGenMsg(buildMsg());setCopied(false);}
  function handleCopy(){navigator.clipboard.writeText(genMsg).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2500);});}
  return (<Card padding={16} style={{marginBottom:20}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:genMsg?12:0}}><Eyebrow style={{fontSize:12}}>Daily Briefing Message</Eyebrow><button onClick={handleGenerate} style={{background:tj.navy900,color:tj.white,border:"none",padding:"8px 20px",fontFamily:tj.fontSans,fontSize:12,fontWeight:700,letterSpacing:"0.08em",cursor:"pointer"}}>Generate</button></div>{genMsg&&(<div><textarea readOnly value={genMsg} onClick={e=>e.target.select()} style={{width:"100%",minHeight:200,fontFamily:tj.fontMono,fontSize:12,padding:"12px",border:`1px solid ${tj.border}`,background:tj.gray50,color:tj.ink,resize:"vertical",lineHeight:1.6}}/><button onClick={handleCopy} style={{marginTop:8,background:copied?tj.ok:tj.sky,color:tj.white,border:"none",padding:"8px 20px",fontFamily:tj.fontSans,fontSize:12,fontWeight:700,cursor:"pointer",letterSpacing:"0.08em"}}>{copied?"Copied!":"Copy to Clipboard"}</button></div>)}</Card>);
}

function App() {
  const [view,setView]=useState("goals");
  const [D,setD]=useState(INIT);
  const [W,setW]=useState(null);
  const [msg,setMsg]=useState("");
  const [,forceTick]=useState(0);
  const [showMonthReset,setShowMonthReset]=useState(false);

  useEffect(()=>{(async()=>{try{const s=await window.storage.get("tejas-coo-m"); if(s?.value){const loaded=JSON.parse(s.value); for(const key of ['bigLake','gonzalez','liveOak']){if(!loaded[key]||(loaded[key].rev?.every(v=>v===0)&&loaded[key].ni?.every(v=>v===0))){if(INIT[key]?.rev?.some(v=>v!==0)) loaded[key]=INIT[key];}} setD(loaded);}}catch(e){} try{const s=await window.storage.get("tejas-coo-w"); if(s?.value) setW(JSON.parse(s.value));}catch(e){}})();},[]);
  useEffect(()=>{const id=setInterval(()=>forceTick(n=>n+1),60000); return()=>clearInterval(id);},[]);

  /* FIX #2: Updated handleFile - uses mergeMonthlyData instead of replacing */
  const handleFile = useCallback(async(file)=>{
    const name=file.name.toLowerCase();
    if(name.endsWith(".csv")){
      const text=await file.text(); const parsed=extractWeekly(text);
      if(parsed&&parsed.locations.length>0){setW(parsed);setMsg("Weekly CSV loaded: "+parsed.updatedThru); try{await window.storage.set("tejas-coo-w",JSON.stringify(parsed));}catch(e){}} else setMsg("Could not parse CSV file");
    } else if(name.endsWith(".xlsx")||name.endsWith(".xls")){
      const buf=await file.arrayBuffer(); const parsed=parseXLSX(buf);
      if(!parsed||!parsed.revenue?.length){setMsg("Could not parse XLSX. Needs month columns and labelled rows.");}
      else {
        const revSum=parsed.revenue.reduce((a,b)=>a+Math.abs(b),0);
        if(revSum===0){setMsg("File parsed but all values are $0. Row labels may not match.");}
        else {
          /* Preserve location data when not in uploaded file */
          for(const key of ['bigLake','gonzalez','liveOak']){
            if(!parsed[key]||(parsed[key].rev?.every(v=>v===0)&&parsed[key].ni?.every(v=>v===0))){
              const existing=D[key]||INIT[key]; if(existing?.rev?.some(v=>v!==0)) parsed[key]=existing;
            }
          }
          /* MERGE instead of replace */
          const merged = mergeMonthlyData(D, parsed);
          setD(merged);
          setMsg(`P&L loaded & merged: ${parsed.months[parsed.months.length-1]} - ${parsed.months.length} months from file`);
          try{await window.storage.set("tejas-coo-m",JSON.stringify(merged));}catch(e){}
        }
      }
    } else setMsg("Upload .csv or .xlsx");
    setTimeout(()=>setMsg(""),5000);
  },[D]);

  const onDrop=useCallback((e)=>{e.preventDefault(); const f=e.dataTransfer?.files?.[0]; if(f) handleFile(f);},[handleFile]);
  const onInput=useCallback((e)=>{const f=e.target.files?.[0]; if(f) handleFile(f);},[handleFile]);

  /* FIX #3: Per-month reset + full reset */
  const clearData = useCallback(async()=>{
    if(!window.confirm("Reset all data back to pre-loaded samples?")) return;
    setD(INIT); setW(null);
    try{await window.storage.delete("tejas-coo-m"); await window.storage.delete("tejas-coo-w");}catch(e){}
    setMsg("Data reset"); setTimeout(()=>setMsg(""),3000);
  },[]);

  const clearMonth = useCallback(async(monthLabel)=>{
    if(!window.confirm(`Clear data for ${monthLabel}? This will zero out that month.`)) return;
    const idx=D.months.indexOf(monthLabel); if(idx<0){setMsg("Month not found");return;}
    const newD={...D, months:[...D.months], shortMo:[...D.shortMo]};
    const arrayKeys=['revenue','grossProfit','ebitda','adjEbitda','ttmEbitda','fixedCosts','variableCosts','labor','netIncome','interest','liquid','solids','skimOil','washout'];
    for(const k of arrayKeys){newD[k]=[...D[k]]; newD[k][idx]=0;}
    for(const locKey of ['bigLake','gonzalez','liveOak']){
      if(D[locKey]){newD[locKey]={rev:[...D[locKey].rev],ni:[...D[locKey].ni]}; newD[locKey].rev[idx]=0; newD[locKey].ni[idx]=0;}
    }
    newD.source=`Cleared ${monthLabel}`; newD.uploadedAt=new Date().toISOString();
    setD(newD);
    try{await window.storage.set("tejas-coo-m",JSON.stringify(newD));}catch(e){}
    setMsg(`${monthLabel} data cleared`); setTimeout(()=>setMsg(""),3000);
    setShowMonthReset(false);
  },[D]);

  /* ─── Computed values ───────────────────────────────── */
  let i=D.revenue.length-1; for(let k=D.revenue.length-1;k>=0;k--){if((D.revenue[k]||0)!==0){i=k;break;}}
  const curRev=D.revenue[i]||0,curGP=D.grossProfit[i]||0,curGM=curRev>0?curGP/curRev:0;
  const curEbitda=D.ebitda[i]||0,curEM=curRev>0?curEbitda/curRev:0,curNI=D.netIncome[i]||0;
  const curTTM=D.ttmEbitda?.[i]||0,curLab=curRev>0?(D.labor[i]||0)/curRev:0,curFC=curRev>0?curRev/(D.fixedCosts[i]||1):0;
  const a3=(k)=>(D[k]||[]).slice(Math.max(0,i-2),i+1).reduce((s,v)=>s+v,0)/Math.min(3,i+1);
  const a3p=(k)=>{const start=Math.max(0,i-5),end=Math.max(0,i-2); return (D[k]||[]).slice(start,end).reduce((s,v)=>s+v,0)/Math.max(1,end-start);};
  const tr=(k,inv)=>{const d=a3(k)-a3p(k); const t=d>0?"up":d<0?"down":"flat"; return inv?(t==="up"?"down":t==="down"?"up":t):t;};
  const wR=W?.locations?.reduce((s,l)=>s+(l.totalRevenue?.weekTotal||0),0)||0;
  const wP=W?.locations?.reduce((s,l)=>s+(l.pl?.weekTotal||0),0)||0;
  const wMR=W?.locations?.reduce((s,l)=>s+(l.totalRevenue?.mtd||0),0)||0;
  const flags=useMemo(()=>generateRedFlags(D,W,i),[D,W,i]);
  const monthlyAge=ageDays(D.uploadedAt); const weeklyAge=ageDays(W?.uploadedAt); const isSample=!D.uploadedAt; const isStale=monthlyAge!==null&&monthlyAge>45;
  const jan26Idx=D.months.findIndex(m=>/Jan\s*26/i.test(m));
  const ytdRev=jan26Idx>=0?D.revenue.slice(jan26Idx).reduce((a,b)=>a+b,0):0;
  const ytdNI=jan26Idx>=0?D.netIncome.slice(jan26Idx).reduce((a,b)=>a+b,0):0;
  const today=new Date(); const daysInMonth=new Date(today.getFullYear(),today.getMonth()+1,0).getDate();

                  </div>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,marginBottom:16}}><tbody>
                    {[{l:"75% Milestone",v:loc.bench.t75,hit:loc.pct>=0.75},{l:"100% Target",v:loc.bench.target,hit:loc.pct>=1.0},{l:"110% Stretch",v:loc.bench.t110,hit:loc.pct>=1.1}].map((t,ti)=>(<tr key={ti} style={{background:t.hit?tj.okBg:ti%2===0?tj.white:tj.gray50,borderBottom:`1px solid ${tj.border}`}}><td style={{padding:"8px 10px",fontWeight:700,color:t.hit?tj.ok:tj.navy900}}>{t.hit?"✓ ":""}{t.l}</td><td style={{padding:"8px 10px",textAlign:"right",fontFamily:tj.fontMono,color:tj.navy900}}>{fmtF(t.v)}</td><td style={{padding:"8px 10px",textAlign:"right",fontFamily:tj.fontMono,fontSize:10,color:t.hit?tj.ok:tj.crimson}}>{t.hit?"HIT":fmtF(t.v-loc.combined)+" to go"}</td></tr>))}
                  </tbody></table>
                  {loc.gap>0&&(<div style={{padding:"14px 16px",background:tj.surfaceCream,border:`1px solid ${tj.border}`,marginBottom:16}}><div style={{fontSize:10,fontWeight:700,color:tj.navy900,marginBottom:10,letterSpacing:"0.06em",textTransform:"uppercase"}}>What You Need</div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12}}><div><div style={{fontSize:8,color:tj.gray500,fontWeight:700,marginBottom:4}}>GAP</div><div style={{fontFamily:tj.fontMono,fontSize:16,fontWeight:700,color:tj.crimson}}>{fmtF(loc.gap)}</div></div><div><div style={{fontSize:8,color:tj.gray500,fontWeight:700,marginBottom:4}}>NEED/MO</div><div style={{fontFamily:tj.fontMono,fontSize:16,fontWeight:700,color:tj.navy900}}>{fmtF(loc.needPerMonth)}</div></div><div><div style={{fontSize:8,color:tj.gray500,fontWeight:700,marginBottom:4}}>NEED/DAY</div><div style={{fontFamily:tj.fontMono,fontSize:16,fontWeight:700,color:tj.navy900}}>{fmtF(loc.needPerDay)}</div></div></div></div>)}
                  <div style={{fontSize:11,color:tj.gray700,paddingTop:12,borderTop:`1px solid ${tj.border}`}}>Annualized pace: <b style={{color:loc.annualized>=loc.bench.target?tj.ok:tj.crimson,fontFamily:tj.fontMono}}>{fmt(loc.annualized)}</b><span style={{marginLeft:8,color:loc.annualized>=loc.bench.target?tj.ok:tj.crimson,fontStyle:"italic"}}>{loc.annualized>=loc.bench.target?"Will hit target":"Will miss at this pace"}</span></div>
                </div>
              </Card>))}
            </div>

            {/* MONTHLY TABLE */}
            <Card padding={0} style={{overflowX:"auto"}}>
              <div style={{padding:"16px 20px"}}><Eyebrow>Monthly Revenue vs Target by Location</Eyebrow><div style={{fontSize:10,color:tj.gray500,marginTop:4,fontFamily:tj.fontSerif,fontStyle:"italic"}}>Actuals in black. Upcoming months show target needed. Green = hit target. Red = missed.</div></div>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,fontFamily:tj.fontMono}}>
                <thead><tr style={{background:tj.navy900}}><th style={{padding:"8px 10px",textAlign:"left",color:tj.white,fontSize:9,fontFamily:tj.fontSans,fontWeight:700}}>Month</th><th style={{padding:"8px 10px",textAlign:"right",color:tj.white,fontSize:9,fontFamily:tj.fontSans}}>Big Lake</th><th style={{padding:"8px 10px",textAlign:"right",color:tj.white,fontSize:9,fontFamily:tj.fontSans}}>Gonzalez</th><th style={{padding:"8px 10px",textAlign:"right",color:tj.white,fontSize:9,fontFamily:tj.fontSans}}>Live Oak</th><th style={{padding:"8px 10px",textAlign:"right",color:tj.sky,fontSize:9,fontFamily:tj.fontSans,fontWeight:700}}>Company</th><th style={{padding:"8px 10px",textAlign:"right",color:tj.sky,fontSize:9,fontFamily:tj.fontSans}}>vs Target</th></tr></thead>
                <tbody>
                  {D.months.map((mo,j)=>{if(jan26Idx>=0&&j<jan26Idx) return null; const bl=D.bigLake?.rev?.[j]||0,gz=D.gonzalez?.rev?.[j]||0,lo=D.liveOak?.rev?.[j]||0,total=D.revenue[j]||0; const monthlyTgt=BENCH.total.target/12; const delta=total>0?total-monthlyTgt:0; const cur=j===i; if(total===0) return null;
                    return (<tr key={j} style={{background:cur?"#EFF3FB":j%2===0?tj.white:tj.gray50,borderBottom:`1px solid ${tj.border}`}}><td style={{padding:"8px 10px",fontFamily:tj.fontSans,fontWeight:cur?700:400}}>{mo}{cur?" ◄":""}</td><td style={{padding:"8px 10px",textAlign:"right",color:bl>=BENCH.bigLake.target/12?tj.ok:bl>0?tj.crimson:tj.gray300}}>{bl>0?fmtF(bl):"-"}</td><td style={{padding:"8px 10px",textAlign:"right",color:gz>=BENCH.gonzalez.target/12?tj.ok:gz>0?tj.crimson:tj.gray300}}>{gz>0?fmtF(gz):"-"}</td><td style={{padding:"8px 10px",textAlign:"right",color:lo>=BENCH.liveOak.target/12?tj.ok:lo>0?tj.crimson:tj.gray300}}>{lo>0?fmtF(lo):"-"}</td><td style={{padding:"8px 10px",textAlign:"right",fontWeight:700,color:total>=monthlyTgt?tj.ok:total>0?tj.crimson:tj.gray300}}>{fmtF(total)}</td><td style={{padding:"8px 10px",textAlign:"right",color:delta>=0?tj.ok:tj.crimson,fontWeight:700}}>{(delta>=0?"+":"")+fmtF(delta)}</td></tr>);
                  })}
                  {(()=>{
                    const allMonths2026=["Jan 26","Feb 26","Mar 26","Apr 26","May 26","Jun 26","Jul 26","Aug 26","Sep 26","Oct 26","Nov 26","Dec 26"];
                    const closedLabels=D.months.filter((_,j)=>j>=(jan26Idx>=0?jan26Idx:0)&&(D.revenue[j]||0)!==0);
                    const futureMonths=allMonths2026.filter(m=>!closedLabels.includes(m));
                    if(futureMonths.length===0) return null;
                    const blYTD=locData.find(l=>l.k==="bigLake")?.combined||0,gzYTD=locData.find(l=>l.k==="gonzalez")?.combined||0,loYTD=locData.find(l=>l.k==="liveOak")?.combined||0;
                    const blNeed=Math.max(0,(BENCH.bigLake.target-blYTD)/futureMonths.length),gzNeed=Math.max(0,(BENCH.gonzalez.target-gzYTD)/futureMonths.length),loNeed=Math.max(0,(BENCH.liveOak.target-loYTD)/futureMonths.length),coNeed=blNeed+gzNeed+loNeed;
                    return (<React.Fragment><tr style={{borderTop:`3px solid ${tj.sky}`}}><td colSpan={6} style={{padding:"6px 10px",fontSize:9,color:tj.sky,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",fontFamily:tj.fontSans,background:"#EBF5FB"}}>UPCOMING - Revenue needed per month to hit 100% target ({futureMonths.length} months remaining)</td></tr>{futureMonths.map((mo,fi)=>{const isNext=fi===0; return (<tr key={mo} style={{background:isNext?"#E3F2FD":"#F5FAFF",borderBottom:`1px solid ${tj.border}`}}><td style={{padding:"8px 10px",fontFamily:tj.fontSans,fontWeight:isNext?700:400,color:tj.sky}}>{mo}{isNext?" ← NEXT":""}</td><td style={{padding:"8px 10px",textAlign:"right",color:tj.sky,fontWeight:isNext?700:400}}>{fmtF(blNeed)}</td><td style={{padding:"8px 10px",textAlign:"right",color:tj.sky,fontWeight:isNext?700:400}}>{fmtF(gzNeed)}</td><td style={{padding:"8px 10px",textAlign:"right",color:tj.sky,fontWeight:isNext?700:400}}>{fmtF(loNeed)}</td><td style={{padding:"8px 10px",textAlign:"right",color:tj.sky,fontWeight:700}}>{fmtF(coNeed)}</td><td style={{padding:"8px 10px",textAlign:"right",fontSize:9,color:tj.gray500}}>target</td></tr>);})}</React.Fragment>);
                  })()}
                  <tr style={{background:tj.navy900}}><td style={{padding:"9px 10px",fontFamily:tj.fontSans,fontWeight:700,color:tj.white,fontSize:10,letterSpacing:"0.06em",textTransform:"uppercase"}}>YTD ACTUAL</td>{locData.map(l=><td key={l.k} style={{padding:"9px 10px",textAlign:"right",fontWeight:700,color:tj.white}}>{fmtF(l.combined)}</td>)}<td style={{padding:"9px 10px",textAlign:"right",fontWeight:700,color:tj.sky}}>{fmtF(ytdCompany)}</td><td style={{padding:"9px 10px",textAlign:"right",fontWeight:700,color:companyGap>0?tj.crimson:tj.ok}}>{companyGap>0?"("+fmtF(companyGap)+")":"ON TARGET"}</td></tr>
                  <tr style={{background:tj.surfaceCream,borderTop:`2px solid ${tj.navy900}`}}><td style={{padding:"9px 10px",fontFamily:tj.fontSans,fontWeight:700,color:tj.gray700,fontSize:10,letterSpacing:"0.06em",textTransform:"uppercase"}}>ANNUAL TARGET</td><td style={{padding:"9px 10px",textAlign:"right",fontFamily:tj.fontMono,color:tj.gray500}}>{fmtF(BENCH.bigLake.target)}</td><td style={{padding:"9px 10px",textAlign:"right",fontFamily:tj.fontMono,color:tj.gray500}}>{fmtF(BENCH.gonzalez.target)}</td><td style={{padding:"9px 10px",textAlign:"right",fontFamily:tj.fontMono,color:tj.gray500}}>{fmtF(BENCH.liveOak.target)}</td><td style={{padding:"9px 10px",textAlign:"right",fontFamily:tj.fontMono,color:tj.gray500}}>{fmtF(BENCH.total.target)}</td><td style={{padding:"9px 10px"}}/></tr>
                </tbody>
              </table>
            </Card>
          </div>);
        })()}

        {/* ═══════════════════ OPERATIONS TAB ═══════════════════ */}
        {view==="ops"&&(<div>
          {(()=>{
            const ytdCompany=ytdRev+currentMTD; const pctDone=BENCH.total.target>0?ytdCompany/BENCH.total.target:0; const gap=BENCH.total.target-ytdCompany;
            const daysLeft=Math.ceil((new Date(2026,11,31)-today)/86400000); const monthsLeft=Math.max(1,Math.ceil(daysLeft/30.44));
            const needPerMonth=gap>0?gap/monthsLeft:0; const annualizedPace=closedMonths2026>0?(ytdCompany/closedMonths2026)*12:0;
            const tier=pctDone>=1.1?"STRETCH":pctDone>=1.0?"TARGET":pctDone>=0.75?"TIER 1":"BELOW";
            const tierColor=tier==="STRETCH"?tj.sky:tier==="TARGET"?tj.ok:tier==="TIER 1"?tj.warn:tj.crimson;
            return (<Card padding={0} style={{marginBottom:20,overflow:"hidden"}}>
              <div style={{background:tj.navy900,padding:"16px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
                <div><div style={{color:tj.gray300,fontSize:9,fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:4}}>2026 Target</div><div style={{color:tj.white,fontFamily:tj.fontSerif,fontSize:32,fontWeight:700}}>{fmtF(BENCH.total.target)}</div></div>
                <div style={{textAlign:"center"}}><div style={{color:tj.gray300,fontSize:9,fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:4}}>YTD Revenue</div><div style={{color:tj.sky,fontFamily:tj.fontSerif,fontSize:32,fontWeight:700}}>{fmtF(ytdCompany)}</div></div>
                <div style={{textAlign:"center"}}><div style={{color:tj.gray300,fontSize:9,fontWeight:700,letterSpacing:"0.12em",textTransform:"uppercase",marginBottom:4}}>Progress</div><div style={{color:tierColor,fontFamily:tj.fontSerif,fontSize:32,fontWeight:700}}>{(pctDone*100).toFixed(1)}%</div></div>
              </div>
              <div style={{position:"relative",height:28,background:tj.gray100,borderBottom:`1px solid ${tj.border}`}}>
                <div style={{position:"absolute",left:0,top:0,bottom:0,width:`${Math.min(pctDone*100,110)/1.1}%`,background:`linear-gradient(90deg, ${tj.navy900}, ${tierColor})`,opacity:0.85}}/>
              </div>
            </Card>);
          })()}

          {flags.length>0&&(<Card padding={16} style={{marginBottom:20,background:flags[0].severity==="critical"?tj.badBg:tj.warnBg,border:`2px solid ${flags[0].severity==="critical"?tj.crimson:tj.warn}`}}><Eyebrow color={flags[0].severity==="critical"?tj.crimson:tj.warn} style={{marginBottom:10,fontSize:12}}>{flags[0].severity==="critical"?"CRITICAL ALERTS":"RED FLAGS"} ({flags.length})</Eyebrow>{flags.map((f,fi)=>(<div key={fi} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"6px 0",borderTop:fi?`1px solid ${tj.border}`:undefined}}><span style={{fontSize:10,fontWeight:700,color:f.severity==="critical"?tj.crimson:f.severity==="high"?tj.warn:tj.gray500,flexShrink:0,marginTop:1}}>{f.severity==="critical"?"CRITICAL":f.severity==="high"?"HIGH":"WATCH"}</span><span style={{fontSize:12,color:tj.ink,fontFamily:tj.fontSerif}}>{f.text}</span></div>))}</Card>)}

          <Section title={`Scorecard - ${D.months?.[i]||"-"}`} eyebrowColor={tj.navy900}>
            <Card padding={20}>
              <ScoreRow label="Monthly Revenue" sub={`Target: ${fmt(monthlyTarget)}/mo`} value={fmt(curRev)} target={`≥${fmt(monthlyTarget)}`} status={curRev>=monthlyTarget?"green":curRev>=monthlyTarget*0.75?"yellow":"red"} trend={tr("revenue")} sparkData={D.revenue} sparkColor={tj.navy900}/>
              <ScoreRow label="Gross Margin %" sub="Pricing power + COGS" value={pct(curGM)} target="≥30%" status={curGM>=0.3?"green":curGM>=0.2?"yellow":"red"} trend={tr("grossProfit")} sparkData={D.revenue.map((r,j)=>r>0?D.grossProfit[j]/r:0)}/>
              <ScoreRow label="EBITDA" sub="The number buyers multiply" value={fmt(curEbitda)} target="≥$200K/mo" status={curEbitda>=200000?"green":curEbitda>=100000?"yellow":"red"} trend={tr("ebitda")} sparkData={D.ebitda}/>
              <ScoreRow label="Net Income" sub="Bottom line" value={fmtF(curNI)} target="≥$0" status={curNI>=0?"green":"red"} trend={tr("netIncome")} sparkData={D.netIncome}/>
              <ScoreRow label="Labor % Rev" sub="Target <14%" value={pct(curLab)} target="<14%" status={curLab<=0.14?"green":curLab<=0.16?"yellow":"red"} trend={tr("labor",true)} sparkData={D.revenue.map((r,j)=>r>0?(D.labor[j]||0)/r:0)}/>
              <ScoreRow label="Fixed Cost Coverage" sub="Revenue / Fixed Costs" value={`${curFC.toFixed(1)}x`} target="≥2.0x" status={curFC>=2?"green":curFC>=1.5?"yellow":"red"} trend={tr("revenue")} sparkData={D.revenue.map((r,j)=>r/(D.fixedCosts[j]||1))}/>
            </Card>
          </Section>

          <Section title="TTM Adjusted EBITDA - Valuation Driver" eyebrowColor={curTTM>=4e6?tj.ok:tj.crimson}>
            <Card padding={20}>
              <div style={{display:"flex",gap:24,marginBottom:16,flexWrap:"wrap"}}>
                <div><span style={{fontSize:11,color:tj.gray500}}>Current TTM: </span><b style={{fontFamily:tj.fontMono,fontSize:20,color:curTTM>=4e6?tj.ok:tj.crimson}}>{fmtF(curTTM)}</b></div>
                <div><span style={{fontSize:11,color:tj.gray500}}>At 5x: </span><b style={{fontFamily:tj.fontMono,fontSize:16,color:tj.navy900}}>{fmtF(curTTM*5)}</b></div>
              </div>
              <Bars data={D.ttmEbitda} labels={D.shortMo} colorFn={v=>v>=4000000?tj.ok:v>=3000000?tj.warn:tj.crimson} width={600} height={100}/>
            </Card>
          </Section>

          <Section title="Revenue Candlestick" eyebrowColor={tj.navy900}>
            <Card padding={20}><CandleChart revData={D.revenue} niData={D.netIncome} labels={D.shortMo} width={700} height={240} targetLine={monthlyTarget}/></Card>
          </Section>

          <Section title="Net Profit Candlestick" eyebrowColor={curNI>=0?tj.ok:tj.crimson}>
            <Card padding={20}><NetProfitCandle D={D} monthlyTarget={monthlyTarget}/></Card>
          </Section>

          <Section title="Cost Structure" eyebrowColor={tj.navy900}>
            <Card padding={20}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:20}}>
                <div><Eyebrow style={{marginBottom:8}}>Fixed Costs</Eyebrow><Bars data={D.fixedCosts} labels={D.shortMo} width={280} height={100} colorFn={()=>tj.crimson}/></div>
                <div><Eyebrow style={{marginBottom:8}}>Variable Costs</Eyebrow><Bars data={D.variableCosts} labels={D.shortMo} width={280} height={100} colorFn={()=>tj.warn}/></div>
                <div><Eyebrow style={{marginBottom:8}}>Labor</Eyebrow><Bars data={D.labor} labels={D.shortMo} width={280} height={100} colorFn={()=>tj.sky}/></div>
              </div>
            </Card>
          </Section>

          <Section title="Revenue Streams" eyebrowColor={tj.navy900}>
            <Card padding={20}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
                <div><Eyebrow style={{marginBottom:8}}>Liquids vs Solids</Eyebrow><Bars data={D.liquid} labels={D.shortMo} width={340} height={80} colorFn={()=>tj.sky}/><div style={{marginTop:8}}><Bars data={D.solids} labels={D.shortMo} width={340} height={80} colorFn={()=>tj.ok}/></div></div>
                <div><Eyebrow style={{marginBottom:8}}>Skim Oil vs Washout</Eyebrow><Bars data={D.skimOil} labels={D.shortMo} width={340} height={80} colorFn={()=>tj.warn}/><div style={{marginTop:8}}><Bars data={D.washout} labels={D.shortMo} width={340} height={80} colorFn={()=>tj.gray500}/></div></div>
              </div>
            </Card>
          </Section>
        </div>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
